# Logs aircraft that pass near the house from an ADS-B receiver
# (PiAware/SkyAware, tar1090, readsb) and charts when and where they fly.
name: Overflights
version: "0.7.2"
slug: overflights
description: Logs aircraft that pass over the house and charts when and where they fly.
url: https://github.com/timd/ha-apps/tree/main/overflights
image: ghcr.io/timd/{arch}-overflights
arch:
  - amd64
  - aarch64
init: false
ingress: true
panel_icon: mdi:airplane
panel_title: Overflights
# SQLite in WAL mode can restore broken from a copy taken while it writes.
# A cold backup stops the App for the seconds the copy takes.
backup: cold
# Home Assistant sensors go through the MQTT broker, if there is one.
services:
  - mqtt:want
options:
  receiver_url: http://piaware.local/skyaware/data
  capture_radius_km: 30
  poll_seconds: 5
  retention_days: 365
  default_radius_km: 5
  default_max_altitude_ft: 0
  demo_data: false
  airport_radius_km: 25
  runways: []
schema:
  receiver_url: url
  latitude: float?
  longitude: float?
  airport: str?
  airport_latitude: float?
  airport_longitude: float?
  airport_radius_km: float(0,100)
  runways:
    - str
  capture_radius_km: float(1,100)
  poll_seconds: int(1,60)
  retention_days: int(7,3650)
  default_radius_km: float(0.5,100)
  default_max_altitude_ft: int(0,60000)
  demo_data: bool
