# Local App: logs aircraft that pass near the house, from the PiAware
# receiver's aircraft.json, and charts when and where they fly.
name: Overflights
version: "0.2.0"
slug: overflights
description: Logs aircraft that pass over the house and charts when and where they fly.
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:airplane
panel_title: Overflights
# SQLite in WAL mode can restore broken from a copy taken while it writes.
# A cold backup stops the App for the seconds the copy takes.
backup: cold
watchdog: http://[HOST]:[PORT:8099]/api/health
options:
  receiver_url: http://adsb.home.arpa/skyaware/data
  capture_radius_km: 30
  poll_seconds: 5
  retention_days: 365
  default_radius_km: 5
  default_max_altitude_ft: 0
  demo_data: false
schema:
  receiver_url: url
  latitude: float?
  longitude: float?
  capture_radius_km: float(1,100)
  poll_seconds: int(1,60)
  retention_days: int(7,3650)
  default_radius_km: float(0.5,100)
  default_max_altitude_ft: int(0,60000)
  demo_data: bool
