configuration:
  receiver_url:
    name: Receiver data URL
    description: >-
      The folder that holds aircraft.json and receiver.json. PiAware:
      http://<host>/skyaware/data. tar1090 or ultrafeeder: http://<host>/tar1090/data.
  latitude:
    name: Latitude
    description: The house position. Leave empty to read it from the receiver.
  longitude:
    name: Longitude
    description: The house position. Leave empty to read it from the receiver.
  airport:
    name: Airport
    description: >-
      Optional. The ICAO or IATA code of the main airport near the house, for
      example EDDB or BER. The App looks up its position and runways. An arrival
      must then move toward it, and a departure away from it.
  airport_latitude:
    name: Airport latitude
    description: Optional. Overrides the position found from the airport code.
  airport_longitude:
    name: Airport longitude
    description: Optional. Overrides the position found from the airport code.
  airport_radius_km:
    name: Airport radius (km)
    description: >-
      Positions within this distance of the airport are stored too, so arrivals and
      departures reach the airport on the map. 0 turns this off.
  runways:
    name: Runways
    description: >-
      Optional. Overrides the runways found from the airport code. Each runway as
      "lat,lon,lat,lon", its two ends. The map draws a dashed line from each arrival
      and departure to a runway end.
  capture_radius_km:
    name: Capture radius (km)
    description: >-
      Positions further from the house than this are not stored, except near the
      airport. Only aircraft that come this close count as passes.
  poll_seconds:
    name: Poll interval (seconds)
    description: How often the App reads the receiver.
  retention_days:
    name: Retention (days)
    description: Passes older than this are deleted.
  default_radius_km:
    name: Overhead radius (km)
    description: What counts as overhead. The page starts with this radius, and the sensors use it.
  default_max_altitude_ft:
    name: Overhead altitude limit (ft)
    description: The page and the sensors count only aircraft below this altitude. 0 means any altitude.
  demo_data:
    name: Demo data
    description: >-
      Adds 60 days of made-up passes built from the receiver's last hour of tracks.
      Turn it off and restart to delete them. Sensors never count them.
  tile_url:
    name: Map tile URL
    description: >-
      Optional. The tile server for the map, with {z}, {x} and {y}. Empty means
      https://tile.openstreetmap.de/{z}/{x}/{y}.png. The App fetches each tile
      once a month at most.
